<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computers Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <h1>Computers Dashboard</h1>
      </div>
      <div class="header-right">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="search" id="search" placeholder="Search hostname, IP, MAC, user, site…" autocomplete="off" />
        </div>
      </div>
    </header>

    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab active" data-filter="all" role="tab">
          All <span class="badge" id="badge-all">0</span>
        </button>
        <button class="tab" data-filter="domain" role="tab">
          Domain <span class="badge" id="badge-domain">0</span>
        </button>
        <button class="tab" data-filter="pos" role="tab">
          POS <span class="badge" id="badge-pos">0</span>
        </button>
      </div>
      <div class="toolbar-actions">
        <button class="btn btn-ghost" id="btn-refresh" title="Refresh now">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
          </svg>
          Refresh
        </button>
      </div>
    </div>

    <!-- POS group filters (shown only when POS tab is active) -->
    <div class="group-bar" id="group-bar" hidden>
      <button class="group-chip active" data-group="">All groups</button>
      <!-- chips injected by JS -->
    </div>

    <main class="main">
      <div class="table-card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th data-sort="hostname">Hostname</th>
                <th data-sort="ip">IP Address</th>
                <th data-sort="username">User</th>
                <th data-sort="site">Site</th>
                <th data-sort="mac">MAC Address</th>
                <th data-sort="type">Type</th>
                <th data-sort="last_seen">Last Seen</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="empty-state" id="empty" hidden>
          <p>No devices found</p>
          <span>Waiting for hosts to report in.</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span id="status-text">Ready</span>
      <span class="footer-right">Auto-refresh every 15s</span>
    </footer>
  </div>

  <!-- Edit modal -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>Edit device</h2>
        <button class="btn-icon modal-close" id="modal-close" title="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p class="modal-hostname" id="modal-hostname"></p>
        <label>
          <span>Username</span>
          <input type="text" id="edit-username" placeholder="Logged-in user or label" />
        </label>
        <label>
          <span>Site / Location</span>
          <select id="edit-site">
            <option value="">— None —</option>
          </select>
        </label>
        <p class="modal-hint">Only username and site can be edited. IP, MAC and hostname are updated by the agent.</p>
      </div>
      <div class="modal-footer">
        <button class="btn" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-save">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
